# cargo-audit configuration for dotsec-rs.
#
# Each `ignore` entry must include a rationale. Run `cargo audit` without the
# list now and then: an ignore that no longer matches anything is dead weight
# that would silently hide a future advisory with the same ID.

[advisories]
# Treat unmaintained crates as warnings, not failures — they're not vulnerabilities,
# only signals that the upstream repo is dormant. We surface them in audit output
# but don't gate CI on them.
informational_warnings = ["unmaintained"]

# No ignores: every advisory is either fixed or not in the dependency tree.
# Add one only with a written rationale (what's affected, why we're not
# reachable, when to revisit), and remove it once it no longer matches.
ignore = []
