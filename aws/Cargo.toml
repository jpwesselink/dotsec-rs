[package]
name = "aws"
version = "7.0.1"
edition = "2021"
description = "AWS KMS encryption for dotsec"
license = "MIT"

[dependencies]
aws-config = { version = "1.1.1", features = ["behavior-version-latest"] }
# Defaults minus `rustls`, which pulls the legacy hyper 0.14 / rustls 0.21
# stack (RUSTSEC-2026-0258/0346/0349/0382); `default-https-client` already
# provides TLS via rustls 0.23.
aws-sdk-kms = { version = "1.47.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-secretsmanager = { version = "1.47.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-ssm = { version = "1.47.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
base64 = { workspace = true }
crypto = { path = "../crypto" }
thiserror = { workspace = true }
zeroize = "1.8"

[dev-dependencies]
testcontainers = "0.23"
tokio = { workspace = true }

