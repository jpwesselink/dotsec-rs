[workspace]
resolver = "2"
members = ["dotsec", "dotsec-core", "aws", "dotenv", "dotsec-napi", "crypto"]

[workspace.dependencies]
# No `simd-unsafe`: we only use the scalar STANDARD engine, and base64 here
# decodes attacker-influenced header fields — keep unsafe SIMD code out.
base64 = { version = "0.23", default-features = false, features = ["std"] }
colored = "3"
log = "0.4.20"
pest = "2.1"
thiserror = "2"
tokio = { version = "1.35.0", features = ["full", "process"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
